<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿集 - Photo Gallery</title>
  <style>
    /* 全局樣式設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    /* 響應式圖片網格 (CSS Grid) */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 0 0.5rem;
    }

    .gallery-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .image-wrapper {
      width: 100%;
      height: 240px; /* 固定高度，確保卡片整齊 */
      overflow: hidden;
      background-color: #eee;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 自動裁切符合比例 */
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-card:hover .image-wrapper img {
      transform: scale(1.05);
    }

    .card-title {
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      color: #666;
      word-break: break-all;
      text-align: center;
      background-color: #fff;
    }

    /* 燈箱 Modal (點擊圖片放大檢視) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>我的相簿</h1>
  </header>

  <main class="gallery-container">
    <!-- 圖片卡片列表 (已更正路徑為 images/...) -->
    <div class="gallery-card" onclick="openModal('images/IMG_6009.png')">
      <div class="image-wrapper">
        <img src="images/IMG_6009.png" alt="IMG_6009.png" loading="lazy">
      </div>
      <div class="card-title">IMG_6009.png</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/10.jpeg')">
      <div class="image-wrapper">
        <img src="images/10.jpeg" alt="10.jpeg" loading="lazy">
      </div>
      <div class="card-title">10.jpeg</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/IMG_6020.jpeg')">
      <div class="image-wrapper">
        <img src="images/IMG_6020.jpeg" alt="IMG_6020.jpeg" loading="lazy">
      </div>
      <div class="card-title">IMG_6020.jpeg</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/IMG_6058_Original.jpeg')">
      <div class="image-wrapper">
        <img src="images/IMG_6058_Original.jpeg" alt="IMG_6058_Original.jpeg" loading="lazy">
      </div>
      <div class="card-title">IMG_6058_Original.jpeg</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/IMG_6062.jpeg')">
      <div class="image-wrapper">
        <img src="images/IMG_6062.jpeg" alt="IMG_6062.jpeg" loading="lazy">
      </div>
      <div class="card-title">IMG_6062.jpeg</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/IMG_6128.jpeg')">
      <div class="image-wrapper">
        <img src="images/IMG_6128.jpeg" alt="IMG_6128.jpeg" loading="lazy">
      </div>
      <div class="card-title">IMG_6128.jpeg</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/IMG_6129.jpeg')">
      <div class="image-wrapper">
        <img src="images/IMG_6129.jpeg" alt="IMG_6129.jpeg" loading="lazy">
      </div>
      <div class="card-title">IMG_6129.jpeg</div>
    </div>

    <div class="gallery-card" onclick="openModal('images/IMG_6131.jpeg')">
      <div class="image-wrapper">
        <img src="images/IMG_6131.jpeg" alt="IMG_6131.jpeg" loading="lazy">
      </div>
      <div class="card-title">IMG_6131.jpeg</div>
    </div>
  </main>

  <!-- 燈箱彈窗結構 -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img class="modal-content" id="fullImage" src="" alt="放大圖片">
  </div>

  <script>
    // 開啟放大圖片燈箱
    function openModal(imageSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('fullImage');
      modal.style.display = 'flex';
      modalImg.src = imageSrc;
    }

    // 關閉燈箱
    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    // 按下 Esc 鍵關閉燈箱
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });
  </script>

</body>
</html>
