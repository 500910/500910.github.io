<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archet Bows | Precision in Every Arc</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafafa;
            color: #222222;
            line-height: 1.6;
        }

        /* 導覽列與 Logo 區塊 */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #111111;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #000000;
        }

        /* 主內容頁面容器 */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-section h1 {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .hero-section p {
            font-size: 1.1rem;
            color: #777777;
            font-style: italic;
        }

        /* 藝廊卡片網格佈局 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .gallery-card {
            background-color: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            overflow: hidden;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        /* 關鍵防裁切修復：完全保護弓頭與證書細節 */
        .gallery-card img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid #eeeeee;
            color: #888888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 頁頭與 Logo -->
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Archet Bows Logo">
            <span class="logo-text">ARCHET BOWS</span>
        </div>
        <nav>
            <ul>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- 標題區 -->
        <section class="hero-section">
            <h1>Precision in Every Arc</h1>
            <p>Master Bowmaker Showcase</p>
        </section>

        <!-- 藝廊照片全卡片區塊 -->
        <main class="gallery-grid" id="gallery">
            <div class="gallery-card">
                <img src="images/IMG_6018.jpeg" alt="Craftsmanship Photo 1">
            </div>
            <div class="gallery-card">
                <img src="images/IMG_6019.jpeg" alt="Craftsmanship Photo 2">
            </div>
            <div class="gallery-card">
                <img src="images/IMG_6020.jpeg" alt="Craftsmanship Photo 3">
            </div>
            <div class="gallery-card">
                <!-- 特殊證書區塊（防裁切） -->
                <img src="images/diploma.jpeg" alt="Special Mention Award - Mirecourt 2026">
            </div>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 2026 Archet Bows. All rights reserved.</p>
    </footer>

</body>
</html>
