<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archet Bows Portfolio</title>
    <style>
        /* 基礎版面設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 藝廊卡片網格 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .gallery-card {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            height: 380px; /* 固定卡片高度 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 關鍵修正：確保弓頭、弓身與證書完整呈現，不被裁切 */
        .gallery-card img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gallery-grid">
            <div class="gallery-card">
                <img src="images/IMG_6019.jpeg" alt="Craftsmanship Photo 2">
            </div>
            <div class="gallery-card">
                <img src="images/IMG_6020.jpeg" alt="Craftsmanship Photo 3">
            </div>
            <div class="gallery-card">
                <!-- 請確認 images/ 資料夾內的檔名是否為 diploma.jpeg -->
                <img src="images/diploma.jpeg" alt="Special Mention Award - Mirecourt 2026">
            </div>
        </div>
    </div>

</body>
</html>
