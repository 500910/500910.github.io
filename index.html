<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHETBOW — Fine Bowmaker Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 3rem 1.5rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: #888888;
      text-transform: uppercase;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .gallery-card {
      background: #1e1e1e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), border-color 0.4s ease;
      cursor: pointer;
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      border-color: #555555;
    }

    .image-wrapper {
      width: 100%;
      height: 280px;
      overflow: hidden;
      background-color: #181818;
      position: relative;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover .image-wrapper img {
      transform: scale(1.04);
    }

    /* 燈箱 Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .modal-content {
      max-width: 92%;
      max-height: 90vh;
      border-radius: 4px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #aaaaaa;
      font-size: 2.2rem;
      font-weight: 300;
      cursor: pointer;
      user-select: none;
    }

    .close-btn:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>ARCHETBOW</h1>
    <p>Fine Master Bows & Craftsmanship</p>
  </header>

  <main class="gallery-container">
    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/IMG_6009.png" data-base="IMG_6009" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>

    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/10.jpeg" data-base="10" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>

    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/IMG_6020.jpeg" data-base="IMG_6020" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>

    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/IMG_6062.jpeg" data-base="IMG_6062" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>

    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/IMG_6128.jpeg" data-base="IMG_6128" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>

    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/IMG_6129.jpeg" data-base="IMG_6129" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>

    <div class="gallery-card" onclick="openModal(this)">
      <div class="image-wrapper">
        <img src="images/IMG_6131.jpeg" data-base="IMG_6131" alt="ARCHETBOW Bow" loading="lazy" onerror="tryNextFormat(this)">
      </div>
    </div>
  </main>

  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img class="modal-content" id="fullImage" src="" alt="ARCHETBOW Detail">
  </div>

  <script>
    // 自動嘗試各種常見的副檔名組合（大寫、小寫、.jpg, .jpeg, .png）
    const extensions = ['.jpeg', '.JPEG', '.jpg', '.JPG', '.png', '.PNG'];

    function tryNextFormat(img) {
      const base = img.getAttribute('data-base');
      let attempt = parseInt(img.getAttribute('data-attempt') || '0');

      if (attempt < extensions.length) {
        const nextExt = extensions[attempt];
        img.setAttribute('data-attempt', attempt + 1);
        // 同時嘗試大寫/小寫 images 資料夾名稱與不同副檔名
        img.src = 'images/' + base + nextExt;
      } else if (attempt === extensions.length) {
        // 嘗試大寫 Images 資料夾
        img.setAttribute('data-attempt', attempt + 1);
        img.src = 'Images/' + base + '.jpeg';
      }
    }

    function openModal(card) {
      const img = card.querySelector('img');
      if (img && img.src) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        modal.style.display = 'flex';
        modalImg.src = img.src;
      }
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeModal();
    });
  </script>

</body>
</html>
